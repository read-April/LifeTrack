<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 背景渐变：折中的深青绿，比上一版浅 -->
    <linearGradient id="lt-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17A17D"/>
      <stop offset="1" stop-color="#0A6B52"/>
    </linearGradient>

    <!-- 路径渐变：从半透明白到纯白 -->
    <linearGradient id="lt-path" x1="18" y1="46" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.6"/>
      <stop offset="1" stop-color="white" stop-opacity="1"/>
    </linearGradient>

    <!-- 节点光晕 -->
    <filter id="lt-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形底 -->
  <rect width="64" height="64" rx="16" fill="url(#lt-bg)"/>

  <!-- 顶部微妙内高光 -->
  <rect x="0" y="0" width="64" height="32" rx="16" fill="white" fill-opacity="0.05"/>

  <!-- 上升轨迹 -->
  <path d="M18 46 Q18 28 32 28 T46 16"
        stroke="url(#lt-path)"
        stroke-width="3.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- 起点节点 -->
  <circle cx="18" cy="46" r="3.4" fill="white" filter="url(#lt-glow)"/>

  <!-- 中间节点 -->
  <circle cx="32" cy="28" r="2.4" fill="white" fill-opacity="0.6"/>

  <!-- 终点节点 -->
  <circle cx="46" cy="16" r="3.8" fill="white" filter="url(#lt-glow)"/>

  <!-- 终点外围光环 -->
  <circle cx="46" cy="16" r="6.5" stroke="white" stroke-opacity="0.28" stroke-width="1.4" fill="none"/>
</svg>