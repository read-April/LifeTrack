[package]
name = "lifetrack"
version = "0.3.0"
description = "LifeTrack · 自知者明，观复知常"
authors = ["yu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lifetrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# 在线更新：从 GitHub Release 拉 latest.json 并验签安装（密钥对见 tauri signer）
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 跨平台解析 config 目录（与 Tauri app_config_dir 对齐：Windows = %APPDATA%\<identifier>），用于启动时读自定义库路径指针
dirs = "5"

# 桌面专属插件：crate 本身无法在安卓/iOS 上编译，按 target 收口，与 lib.rs 的 #[cfg(desktop)] 配套
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
